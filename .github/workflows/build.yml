name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Descomprimir proyecto
        run: |
          mkdir -p work
          unzip -q -o proyectoclipa.zip -d work
          ls -la work

      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compilar APK
        working-directory: work
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Preparar APK
        run: cp work/app/build/outputs/apk/release/app-release.apk Clipa.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Clipa
          path: Clipa.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Clipa v0.1.${{ github.run_number }}
          files: Clipa.apk
          body: |
            Clipa.apk: descárgalo en tu Android e instálalo.
